<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101c26">
<meta name="color-scheme" content="dark">
<title>세균 방어전</title>
<style>
:root{
  --bg:#101c26; --panel:#1b2c3a; --line:#2e4659; --ink:#eaf3f8; --dim:#8fa7b8;
  --gold:#ffd166; --bad:#ff6b6b; --good:#6be3a0; --acc:#3ec6e0;
  --sans:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --hud:46px; --foot:128px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 70% at 50% 0%,#1d3347 0%,var(--bg) 62%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:min(100vw, calc((100vh - var(--hud) - var(--foot) - 8px) * .75), 560px);
     width:min(100vw, calc((100dvh - var(--hud) - var(--foot) - 8px) * .75), 560px);position:relative}
#hud{height:var(--hud);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;font-weight:800;font-size:17px;letter-spacing:-.2px}
#hud .chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:999px;padding:5px 12px;min-width:78px;justify-content:center;
  font-variant-numeric:tabular-nums}
#hud .hp{color:#ff8f8f} #hud .gold{color:var(--gold)} #hud .wv{color:var(--ink)}
.chip.bad{animation:bad .35s}
.chip.hit{animation:hit .4s}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hit{0%{background:rgba(255,107,107,.7);transform:scale(1.12)}100%{background:rgba(255,255,255,.07);transform:scale(1)}}
#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:12px;background:#2c5a3a;box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:none}
#foot{height:var(--foot);padding:8px 8px 0;display:flex;flex-direction:column;gap:8px}
#row1{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:56px}
.tw{position:relative;border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:transform .12s,border-color .12s,background .12s,opacity .12s}
.tw:active{transform:scale(.94)}
.tw .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.tw .dot{width:11px;height:11px;border-radius:50%}
.tw .co{font-size:13px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.tw.on{border-color:var(--acc);background:#223f52;transform:translateY(-2px)}
.tw.poor{opacity:.5}
#panel{display:none;grid-template-columns:1.1fr 1.1fr .7fr;gap:8px;min-height:56px}
#panel.show{display:grid}
#panel .ttl{grid-column:1/-1;display:none}
.pb{border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:15px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s,opacity .12s}
.pb:active{transform:scale(.94)}
.pb small{font-size:12px;font-weight:700;color:var(--gold)}
.pb.up{border-color:#4aa86d;background:#1f4231}
.pb.sell{border-color:#a8574a;background:#43241f}
.pb.sell.armed{background:#8a2f26;border-color:#ff8f7a;color:#fff}
.pb[disabled]{opacity:.4}
#row2{display:grid;grid-template-columns:1fr 84px;gap:8px}
#go{height:50px;border-radius:14px;background:linear-gradient(#37c77a,#27a864);font-weight:900;font-size:18px;color:#06281a;box-shadow:0 3px 0 #17724a;
  transition:transform .1s,box-shadow .1s,filter .12s}
#go:active{transform:translateY(3px);box-shadow:0 0 0 #17724a}
#go[disabled]{filter:grayscale(.8) brightness(.7);box-shadow:none}
#go.pulse:not([disabled]){animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
#spd{height:50px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:900;font-size:18px;transition:transform .1s,background .15s}
#spd:active{transform:scale(.94)}
#spd.fast{background:#5a4a1b;border-color:var(--gold);color:var(--gold)}
#ov{position:absolute;left:0;right:0;top:var(--hud);aspect-ratio:3/4;display:none;align-items:center;justify-content:center;border-radius:12px;background:rgba(8,16,24,.72)}
#ov.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#ov .box{text-align:center;padding:24px 28px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#ov h1{margin:0 0 6px;font-size:40px;letter-spacing:-1px}
#ov.win h1{color:var(--gold)} #ov.lose h1{color:#ff8f8f}
#ov p{margin:0 0 18px;color:var(--dim);font-size:16px;font-weight:700}
#again{height:54px;padding:0 34px;border-radius:16px;background:linear-gradient(#37c77a,#27a864);font-weight:900;font-size:19px;color:#06281a;box-shadow:0 3px 0 #17724a}
#again:active{transform:translateY(3px);box-shadow:none}
@media (prefers-reduced-motion:reduce){
  #go.pulse:not([disabled]){animation:none} #ov.show,#ov .box{animation:none} .chip.bad,.chip.hit{animation:none}
}
</style>
</head>
<body>
<div id="stage">
 <div id="app">
  <div id="hud">
   <div class="chip hp" id="hp">♥ 20</div>
   <div class="chip gold" id="gold">● 150</div>
   <div class="chip wv" id="wv">파도 1/10</div>
  </div>
  <canvas id="cv" aria-label="세균 방어전 게임 화면"></canvas>
  <div id="ov"><div class="box"><h1 id="ovT">승리</h1><p id="ovP"></p><button id="again">다시 하기</button></div></div>
  <div id="foot">
   <div id="row1">
    <button class="tw on" data-t="bolt"><span class="nm"><i class="dot" style="background:#3ec6e0"></i>연발</span><span class="co">50</span></button>
    <button class="tw" data-t="blast"><span class="nm"><i class="dot" style="background:#ff9a3c"></i>폭발</span><span class="co">90</span></button>
    <button class="tw" data-t="frost"><span class="nm"><i class="dot" style="background:#9ad8ff"></i>냉각</span><span class="co">70</span></button>
   </div>
   <div id="panel">
    <button class="pb up" id="bUp"><span id="bUpT">강화</span><small id="bUpC"></small></button>
    <button class="pb sell" id="bSell"><span id="bSellT">판매</span><small id="bSellC"></small></button>
    <button class="pb" id="bClose">닫기</button>
   </div>
   <div id="row2">
    <button id="go" class="pulse">다음 파도 ▶</button>
    <button id="spd">1×</button>
   </div>
  </div>
 </div>
</div>
<script>
(function(){
'use strict';
const CELL=40, COLS=9, ROWS=12, W=360, H=480, TOTAL_WAVES=10;
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const PF = REDUCE ? 0.3 : 1;

/* ---------- 길 ---------- */
const WP = [[-20,60],[300,60],[300,180],[60,180],[60,300],[300,300],[300,420],[100,420],[100,456]];
const segs=[]; let pathLen=0;
for(let i=0;i<WP.length-1;i++){
  const a=WP[i],b=WP[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);
  segs.push({a,b,l,s:pathLen,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}); pathLen+=l;
}
function posAt(d){
  if(d<=0){return {x:WP[0][0],y:WP[0][1],ang:segs[0].ang};}
  for(const s of segs){ if(d<=s.s+s.l){const t=(d-s.s)/s.l;return {x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,ang:s.ang};} }
  const s=segs[segs.length-1]; return {x:s.b[0],y:s.b[1],ang:s.ang};
}
const blocked=[]; for(let r=0;r<ROWS;r++){blocked.push(new Array(COLS).fill(false));}
for(const s of segs){
  const n=Math.ceil(s.l/4);
  for(let i=0;i<=n;i++){
    const x=s.a[0]+(s.b[0]-s.a[0])*i/n, y=s.a[1]+(s.b[1]-s.a[1])*i/n;
    const c=Math.floor(x/CELL), r=Math.floor(y/CELL);
    if(c>=0&&c<COLS&&r>=0&&r<ROWS) blocked[r][c]=true;
  }
}
blocked[11][2]=true; // 기지 칸
const nearPath=(c,r)=>{ for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc; if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&blocked[rr][cc]) return true;} return false; };
// 풀 장식(고정)
const tufts=[]; { let s=7; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<46;i++){const x=rnd()*W,y=rnd()*H;const c=Math.floor(x/CELL),r=Math.floor(y/CELL); if(!blocked[r]||blocked[r][c])continue; tufts.push([x,y,2+rnd()*3]);} }

/* ---------- 정의 ---------- */
const TYPES={
  bolt :{name:'연발',cost:50,color:'#3ec6e0',lv:[{dmg:8,rng:100,cd:.45},{dmg:14,rng:108,cd:.38,up:40},{dmg:24,rng:118,cd:.3,up:70}]},
  blast:{name:'폭발',cost:90,color:'#ff9a3c',lv:[{dmg:22,rng:96,cd:1.4,sp:46},{dmg:36,rng:104,cd:1.3,sp:54,up:80},{dmg:56,rng:112,cd:1.2,sp:62,up:120}]},
  frost:{name:'냉각',cost:70,color:'#9ad8ff',lv:[{dmg:3,rng:92,cd:.8,slow:.4,st:1.4},{dmg:5,rng:100,cd:.7,slow:.5,st:1.7,up:60},{dmg:9,rng:108,cd:.6,slow:.6,st:2,up:90}]}
};
const ENEMY={
  n:{hp:68,sp:44,gold:5,r:10,leak:1,col:'#7bd96a',dk:'#3f8a3a'},
  f:{hp:44,sp:78,gold:6,r:8,leak:1,col:'#ffc542',dk:'#a8741a'},
  t:{hp:230,sp:32,gold:12,r:12,leak:1,col:'#8a9ac0',dk:'#4a587c'},
  b:{hp:1000,sp:26,gold:120,r:18,leak:5,col:'#a55bd6',dk:'#5c2a85'}
};
const WAVES=[
  [['n',6,1.2]],
  [['n',10,1.0]],
  [['n',8,1.0],['f',5,.7]],
  [['t',3,2],['n',10,.8]],
  [['f',16,.5],['n',10,.7]],
  [['t',8,1.4],['f',10,.55]],
  [['n',18,.6],['t',6,1.4]],
  [['f',18,.45],['t',9,1.2]],
  [['t',14,1.0],['f',14,.5]],
  [['b',2,6],['t',8,1.0],['f',12,.5]]
];
const CFG={hpScale:0.35,bonus:5};
const START_GOLD=150, START_HP=20;

/* ---------- 상태 ---------- */
let G;
function newGame(){
  G={gold:START_GOLD,hp:START_HP,wave:0,active:false,queue:[],clock:0,enemies:[],towers:[],projs:[],parts:[],rings:[],floats:[],
     time:0,state:'play',speed:1,sel:null,build:'bolt',shake:0,nid:1,hover:null,flashBase:0};
  syncUI(); ov.classList.remove('show','win','lose');
}
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), ov=$('ov');

/* ---------- 게임 동작 ---------- */
function statOf(t){return TYPES[t.type].lv[t.lv];}
function totalSpent(t){let s=TYPES[t.type].cost;for(let i=1;i<=t.lv;i++)s+=TYPES[t.type].lv[i].up;return s;}
function placeTower(c,r,type){
  if(G.state!=='play')return false;
  if(c<0||r<0||c>=COLS||r>=ROWS||blocked[r][c]||G.towers.some(t=>t.c===c&&t.r===r))return false;
  const cost=TYPES[type].cost; if(G.gold<cost)return false;
  G.gold-=cost;
  const t={type,c,r,x:c*CELL+CELL/2,y:r*CELL+CELL/2,lv:0,cd:.2,ang:-Math.PI/2,rec:0,born:0,show:.9};
  G.towers.push(t); burst(t.x,t.y,TYPES[type].color,10,70); G.rings.push({x:t.x,y:t.y,r:6,gr:90,life:.3,max:.3,col:TYPES[type].color,w:3});
  syncUI(); return t;
}
function upgradeTower(t){
  if(!t||t.lv>=2)return false; const cost=TYPES[t.type].lv[t.lv+1].up; if(G.gold<cost)return false;
  G.gold-=cost; t.lv++; t.show=1; t.born=0;
  burst(t.x,t.y,'#ffe08a',14,90); G.rings.push({x:t.x,y:t.y,r:8,gr:110,life:.35,max:.35,col:'#ffe08a',w:3});
  float(t.x,t.y-22,'강화!','#ffe08a'); syncUI(); return true;
}
function sellTower(t){
  if(!t)return; const v=Math.floor(totalSpent(t)*.7); G.gold+=v;
  G.towers.splice(G.towers.indexOf(t),1); if(G.sel===t)G.sel=null;
  burst(t.x,t.y,'#cfd8dc',10,70); float(t.x,t.y-14,'+'+v,'#ffd166'); syncUI();
}
function startWave(){
  if(G.state!=='play'||G.active||G.wave>=TOTAL_WAVES)return false;
  G.wave++; G.active=true; G.clock=0; G.queue=[]; let tt=0;
  for(const [type,n,gap] of WAVES[G.wave-1]){ for(let i=0;i<n;i++){G.queue.push({at:tt,type});tt+=gap;} tt+=1.2; }
  syncUI(); return true;
}
function spawn(type){
  const d=ENEMY[type], sc=1+CFG.hpScale*(G.wave-1), hp=Math.round(d.hp*sc);
  G.enemies.push({id:G.nid++,type,hp,max:hp,d:0,x:WP[0][0],y:WP[0][1],ang:0,slowT:0,slowF:0,flash:0,dead:false,ph:Math.random()*6});
}
function dmg(e,v){
  if(e.dead)return; e.hp-=v; e.flash=.1;
  if(e.hp<=0){ e.dead=true; const d=ENEMY[e.type]; G.gold+=d.gold; float(e.x,e.y-8,'+'+d.gold,'#ffd166');
    burst(e.x,e.y,d.col,e.type==='b'?34:12,e.type==='b'?170:100); G.rings.push({x:e.x,y:e.y,r:d.r*.6,gr:d.r*3,life:.28,max:.28,col:d.col,w:2});
    if(e.type==='b')G.shake=Math.max(G.shake,.35); syncUI(); }
}
function float(x,y,text,col){G.floats.push({x,y,text,col,life:.9,max:.9});}
function burst(x,y,col,n,sp){ n=Math.max(1,Math.round(n*PF)); for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.8);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.25,max:.6,col,r:1.5+Math.random()*2.5});} }
function findTarget(t,st){
  let best=null,bd=-1;
  for(const e of G.enemies){ if(e.dead)continue; const dx=e.x-t.x,dy=e.y-t.y; if(dx*dx+dy*dy>(st.rng+ENEMY[e.type].r)*(st.rng+ENEMY[e.type].r))continue;
    let score=e.d; if(t.type==='frost'&&e.slowT<=0)score+=100000; if(score>bd){bd=score;best=e;} }
  return best;
}
function fire(t,e,st){
  t.ang=Math.atan2(e.y-t.y,e.x-t.x); t.rec=1;
  const bx=t.x+Math.cos(t.ang)*14, by=t.y+Math.sin(t.ang)*14;
  if(t.type==='bolt')G.projs.push({k:'bolt',x:bx,y:by,tgt:e,tx:e.x,ty:e.y,sp:380,dmg:st.dmg,trail:[]});
  else if(t.type==='blast')G.projs.push({k:'blast',x:bx,y:by,sx:bx,sy:by,tgt:e,tx:e.x,ty:e.y,sp:210,dmg:st.dmg,sprd:st.sp,trail:[],t:0});
  else G.projs.push({k:'frost',x:bx,y:by,tgt:e,tx:e.x,ty:e.y,sp:300,dmg:st.dmg,slow:st.slow,st:st.st,trail:[]});
}
function hitProj(p){
  if(p.k==='bolt'){ if(p.tgt&&!p.tgt.dead)dmg(p.tgt,p.dmg); burst(p.tx,p.ty,'#bff4ff',4,60); }
  else if(p.k==='frost'){ if(p.tgt&&!p.tgt.dead){dmg(p.tgt,p.dmg); applySlow(p.tgt,p.slow,p.st);}
    G.rings.push({x:p.tx,y:p.ty,r:4,gr:60,life:.3,max:.3,col:'#9ad8ff',w:2}); burst(p.tx,p.ty,'#d6f0ff',7,70); }
  else { for(const e of G.enemies){ if(e.dead)continue; if(Math.hypot(e.x-p.tx,e.y-p.ty)<=p.sprd+ENEMY[e.type].r*.6)dmg(e,p.dmg); }
    G.rings.push({x:p.tx,y:p.ty,r:6,gr:p.sprd*4,life:.3,max:.3,col:'#ffb347',w:4,fill:true}); burst(p.tx,p.ty,'#ff9a3c',16,150); burst(p.tx,p.ty,'#ffe08a',8,100);
    if(!REDUCE)G.shake=Math.max(G.shake,.08); }
}
function applySlow(e,f,t){ const k=e.type==='b'?.5:1; e.slowF=Math.max(e.slowT>0?e.slowF:0,f*k); e.slowT=Math.max(e.slowT,t); }

function update(dt){
  if(G.state!=='play')return;
  G.time+=dt;
  if(G.active){
    G.clock+=dt;
    while(G.queue.length&&G.queue[0].at<=G.clock){spawn(G.queue.shift().type);}
    if(!G.queue.length&&!G.enemies.length){
      G.active=false; const bonus=20+G.wave*CFG.bonus; G.gold+=bonus;
      float(180,240,'파도 클리어 +'+bonus,'#ffd166'); syncUI();
      if(G.wave>=TOTAL_WAVES){ finish(true); return; }
    }
  }
  // 적
  for(const e of G.enemies){
    const d=ENEMY[e.type]; if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0)e.slowF=0;}
    e.d+=d.sp*(1-e.slowF)*dt; const p=posAt(e.d); e.x=p.x;e.y=p.y;e.ang=p.ang; if(e.flash>0)e.flash-=dt;
    if(!e.dead&&e.d>=pathLen){ e.dead=true; e.leaked=true; G.hp=Math.max(0,G.hp-d.leak); G.flashBase=.4; G.shake=Math.max(G.shake,.25);
      burst(WP[WP.length-1][0],WP[WP.length-1][1],'#ff6b6b',14,110); hudPulse('hp','hit'); syncUI();
      if(G.hp<=0){finish(false);} }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.state!=='play')return;
  // 포탑
  for(const t of G.towers){
    const st=statOf(t); t.cd-=dt; t.born+=dt; if(t.show>0)t.show-=dt; t.rec=Math.max(0,t.rec-dt*6);
    const e=findTarget(t,st);
    if(e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); if(t.cd<=0){fire(t,e,st);t.cd=st.cd;} }
  }
  // 발사체
  for(const p of G.projs){
    if(p.tgt&&!p.tgt.dead){p.tx=p.tgt.x;p.ty=p.tgt.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),step=p.sp*dt;
    p.trail.push([p.x,p.y]); if(p.trail.length>6)p.trail.shift();
    if(p.k==='blast')p.t+=dt;
    if(dist<=step+3){p.done=true;hitProj(p);} else {p.x+=dx/dist*step;p.y+=dy/dist*step;}
  }
  G.projs=G.projs.filter(p=>!p.done);
  // 효과
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.life-=dt;} G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.rings){q.r+=q.gr*dt;q.life-=dt;} G.rings=G.rings.filter(q=>q.life>0);
  for(const q of G.floats){q.y-=26*dt;q.life-=dt;} G.floats=G.floats.filter(q=>q.life>0);
  if(G.shake>0)G.shake-=dt; if(G.flashBase>0)G.flashBase-=dt;
}
function finish(win){
  G.state=win?'won':'lost'; G.active=false;
  $('ovT').textContent=win?'승리!':'기지가 무너졌어요'; $('ovT').style.fontSize=win?'44px':'28px';
  $('ovP').textContent=win?('체력 '+G.hp+' 남기고 모두 막았어요'):((G.wave)+'파도에서 막혔어요');
  ov.className='show '+(win?'win':'lose');
  if(win&&!REDUCE){for(let i=0;i<60;i++){const cols=['#ffd166','#6be3a0','#3ec6e0','#ff8f8f'];G.parts.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*40,vy:60+Math.random()*120,life:2.5,max:2.5,col:cols[i%4],r:3});}}
  syncUI();
}

/* ---------- UI ---------- */
function hudPulse(id,cls){const el=$(id);el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function syncUI(){
  $('hp').textContent='♥ '+G.hp; $('gold').textContent='● '+G.gold; $('wv').textContent='파도 '+(G.active?G.wave:Math.min(G.wave+1,TOTAL_WAVES))+'/'+TOTAL_WAVES;
  document.querySelectorAll('.tw').forEach(b=>{const t=b.dataset.t;b.classList.toggle('on',G.build===t&&!G.sel);b.classList.toggle('poor',G.gold<TYPES[t].cost);});
  const go=$('go'); const canGo=G.state==='play'&&!G.active&&G.wave<TOTAL_WAVES;
  go.disabled=!canGo; go.textContent=G.active?('파도 '+G.wave+' 진행 중'):(G.wave>=TOTAL_WAVES?'끝':'다음 파도 ▶');
  go.classList.toggle('pulse',canGo);
  $('row1').style.display=G.sel?'none':'grid'; $('panel').classList.toggle('show',!!G.sel);
  if(G.sel){
    const t=G.sel,T=TYPES[t.type]; const nxt=t.lv<2?T.lv[t.lv+1].up:null;
    $('bUpT').textContent=nxt===null?'최대 강화':(T.name+' 강화 '+(t.lv+1)+'→'+(t.lv+2)); $('bUpC').textContent=nxt===null?('3단계 완료'):('● '+nxt);
    $('bUp').disabled=nxt===null||G.gold<nxt; $('bSellC').textContent='+'+Math.floor(totalSpent(t)*.7);
    if(sellArm&&sellArm!==t)disarmSell(); $('bSellT').textContent=sellArm?'한 번 더':'판매'; $('bSell').classList.toggle('armed',!!sellArm);
  }
}
document.querySelectorAll('.tw').forEach(b=>b.addEventListener('click',()=>{disarmSell();G.build=b.dataset.t;G.sel=null;syncUI();}));
$('bUp').addEventListener('click',()=>{if(G.sel){if(!upgradeTower(G.sel)){hudPulse('gold','bad');float(G.sel.x,G.sel.y-22,'돈 부족','#ff8f8f');}}});
let sellArm=null,sellTimer=0;
function disarmSell(){sellArm=null;clearTimeout(sellTimer);const b=$('bSellT');if(b){b.textContent='판매';$('bSell').classList.remove('armed');}}
$('bSell').addEventListener('click',()=>{
  if(!G.sel)return;
  if(sellArm===G.sel){const t=G.sel;disarmSell();sellTower(t);return;}
  sellArm=G.sel; $('bSellT').textContent='한 번 더'; $('bSell').classList.add('armed');
  clearTimeout(sellTimer); sellTimer=setTimeout(disarmSell,2500);
});
$('bClose').addEventListener('click',()=>{disarmSell();G.sel=null;syncUI();});
$('go').addEventListener('click',()=>{startWave();});
$('spd').addEventListener('click',()=>{G.speed=G.speed===1?2:1;$('spd').textContent=G.speed+'×';$('spd').classList.toggle('fast',G.speed===2);});
$('again').addEventListener('click',()=>{const sp=G.speed;newGame();G.speed=sp;});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();startWave();}});

function cellOf(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault(); if(G.state!=='play')return;
  const p=cellOf(ev),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  const t=G.towers.find(t=>t.c===c&&t.r===r);
  if(t){if(G.sel!==t)disarmSell();G.sel=t;t.show=1.2;syncUI();return;}
  if(G.sel){disarmSell();G.sel=null;syncUI();return;}
  if(c<0||r<0||c>=COLS||r>=ROWS)return;
  const fx=c*CELL+CELL/2,fy=r*CELL+CELL/2;
  if(blocked[r][c]){float(fx,fy,'길 위','#ff8f8f');return;}
  if(!placeTower(c,r,G.build)){hudPulse('gold','bad');float(fx,fy,'돈 부족','#ff8f8f');}
});
cv.addEventListener('pointermove',ev=>{ if(ev.pointerType==='mouse'){const p=cellOf(ev);G.hover=[Math.floor(p.x/CELL),Math.floor(p.y/CELL)];} });
cv.addEventListener('pointerleave',()=>{G.hover=null;});

/* ---------- 그리기 ---------- */
let K=1;
function resize(){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;K=r.width/W*dpr;cv.width=Math.round(W*K);cv.height=Math.round(H*K);}
new ResizeObserver(resize).observe(cv); window.addEventListener('resize',resize);

function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);}
function drawGround(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.fillStyle=(r+c)%2?'#2f6a42':'#2b6240';ctx.fillRect(c*CELL,r*CELL,CELL,CELL);}
  ctx.fillStyle='#3a7d50'; for(const t of tufts){ctx.fillRect(t[0],t[1],t[2],1.6);ctx.fillRect(t[0]+1,t[1]-2,1.6,t[2]);}
  // 길
  ctx.lineJoin='round';ctx.lineCap='round';
  const trace=()=>{ctx.beginPath();ctx.moveTo(WP[0][0],WP[0][1]);for(let i=1;i<WP.length;i++)ctx.lineTo(WP[i][0],WP[i][1]);};
  ctx.strokeStyle='#6d5a3c';ctx.lineWidth=34;trace();ctx.stroke();
  ctx.strokeStyle='#c9ae7a';ctx.lineWidth=28;trace();ctx.stroke();
  ctx.strokeStyle='#d8c08d';ctx.lineWidth=14;ctx.setLineDash([2,14]);trace();ctx.stroke();ctx.setLineDash([]);
}
function drawBase(){
  const x=WP[WP.length-1][0],y=WP[WP.length-1][1]+2; const low=G.hp<=6;
  const pulse=1+Math.sin(G.time*3)*.03;
  ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(0,0,0,.3)';circle(0,3,19);ctx.fill();
  ctx.fillStyle='#dfeaf0';circle(0,0,18);ctx.fill();
  ctx.fillStyle=G.flashBase>0?'#ff8f8f':(low?'#ffb0a0':'#9fe0c0');circle(0,0,13);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';circle(-4,-5,4);ctx.fill();
  ctx.restore();
}
function drawTower(t,alpha){
  const T=TYPES[t.type],col=T.color; ctx.save();ctx.translate(t.x,t.y);ctx.globalAlpha=alpha||1;
  const pop=t.born<.25?1+Math.sin(t.born/.25*Math.PI)*.18:1; ctx.scale(pop,pop);
  ctx.fillStyle='rgba(0,0,0,.3)';circle(0,3,16);ctx.fill();
  ctx.fillStyle='#3a4a58';circle(0,0,16);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=3;circle(0,0,14);ctx.stroke();
  ctx.rotate(t.ang||0);
  const rec=(t.rec||0)*4;
  if(t.type==='bolt'){ctx.fillStyle='#d9f6ff';ctx.fillRect(-2-rec,-3,17,6);ctx.fillStyle=col;ctx.fillRect(9-rec,-4,6,8);ctx.fillStyle=col;circle(-1,0,7);ctx.fill();}
  else if(t.type==='blast'){ctx.fillStyle='#5b4333';ctx.fillRect(-3-rec,-6,16,12);ctx.fillStyle=col;ctx.fillRect(8-rec,-7,6,14);ctx.fillStyle='#ffd9a8';circle(-2,0,6);ctx.fill();}
  else{ctx.rotate(G.time*1.2-(t.ang||0));ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<6;i++){const a=i*1.0472,r=i%2?5:12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';circle(0,0,3);ctx.fill();}
  ctx.restore();
  // 단계 점
  ctx.save();ctx.translate(t.x,t.y);for(let i=0;i<=t.lv;i++){ctx.fillStyle='#ffe08a';circle(-((t.lv)*3.5)+i*7,14.5,2.2);ctx.fill();}ctx.restore();
}
function eyes(r,ang){const fx=Math.cos(ang),fy=Math.sin(ang);for(const s of[-1,1]){const ex=fx*r*.35-fy*r*.32*s,ey=fy*r*.35+fx*r*.32*s;ctx.fillStyle='#fff';circle(ex,ey,r*.26);ctx.fill();ctx.fillStyle='#17212b';circle(ex+fx*r*.08,ey+fy*r*.08,r*.13);ctx.fill();}}
function drawEnemy(e){
  const d=ENEMY[e.type],r=d.r*(1+Math.sin(G.time*9+e.ph)*.05); ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,r*.7,r*.9,r*.4,0,0,6.2832);ctx.fill();
  const shape=()=>{
    if(e.type==='n'){circle(0,0,r);}
    else if(e.type==='f'){ctx.beginPath();ctx.ellipse(0,0,r*1.5,r*.85,e.ang,0,6.2832);}
    else if(e.type==='t'){ctx.beginPath();for(let i=0;i<6;i++){const a=i*1.0472+.5236;ctx.lineTo(Math.cos(a)*r*1.1,Math.sin(a)*r*1.1);}ctx.closePath();}
    else{ctx.beginPath();const sp=14;for(let i=0;i<sp*2;i++){const a=i*Math.PI/sp+G.time*.6,rr=i%2?r*.85:r*1.25;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();}
  };
  shape();ctx.fillStyle=d.col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=d.dk;ctx.stroke();
  if(e.type==='t'){ctx.fillStyle=d.dk;circle(0,0,r*.45);ctx.fill();ctx.fillStyle=d.col;circle(0,0,r*.28);ctx.fill();}
  else eyes(e.type==='f'?r*.9:r,e.ang);
  if(e.slowT>0){shape();ctx.fillStyle='rgba(154,216,255,.5)';ctx.fill();}
  if(e.flash>0){shape();ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();}
  ctx.restore();
  if(e.hp<e.max){const w=e.type==='b'?34:22,x=e.x-w/2,y=e.y-d.r-9;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-1,y-1,w+2,5);ctx.fillStyle=e.hp/e.max>.5?'#6be3a0':(e.hp/e.max>.25?'#ffd166':'#ff6b6b');ctx.fillRect(x,y,w*e.hp/e.max,3);}
}
function drawProj(p){
  const col=p.k==='bolt'?'#d9f6ff':(p.k==='frost'?'#bfe8ff':'#ffb347');
  ctx.strokeStyle=col;ctx.lineCap='round';
  for(let i=1;i<p.trail.length;i++){ctx.globalAlpha=i/p.trail.length*.6;ctx.lineWidth=p.k==='blast'?5:3;ctx.beginPath();ctx.moveTo(p.trail[i-1][0],p.trail[i-1][1]);ctx.lineTo(p.trail[i][0],p.trail[i][1]);ctx.stroke();}
  ctx.globalAlpha=1;
  let y=p.y; if(p.k==='blast'){const tot=Math.hypot(p.tx-p.sx,p.ty-p.sy)/p.sp+.001;y-=Math.sin(Math.min(1,p.t/tot)*Math.PI)*10;}
  ctx.fillStyle=col;circle(p.x,y,p.k==='blast'?5.5:(p.k==='frost'?4.5:3.5));ctx.fill();
  if(p.k==='blast'){ctx.fillStyle='#ff6a1a';circle(p.x,y,3);ctx.fill();}
}
function drawRange(x,y,r,col){ctx.fillStyle='rgba(255,255,255,.10)';circle(x,y,r);ctx.fill();ctx.strokeStyle=col||'rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([6,5]);circle(x,y,r);ctx.stroke();ctx.setLineDash([]);}
function render(){
  ctx.setTransform(K,0,0,K,0,0);
  let sx=0,sy=0; if(G.shake>0&&!REDUCE){sx=(Math.random()-.5)*G.shake*14;sy=(Math.random()-.5)*G.shake*14;}
  ctx.save();ctx.translate(sx,sy);
  drawGround(); drawBase();
  // 처음엔 설치 자리 표시(글 없이)
  if(!G.towers.length&&G.wave===0&&G.state==='play'){
    const a=.25+.2*Math.sin(G.time*3);ctx.fillStyle='rgba(255,255,255,'+a+')';
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ if(!blocked[r][c]&&nearPath(c,r)){const x=c*CELL+20,y=r*CELL+20;ctx.fillRect(x-6,y-1.2,12,2.4);ctx.fillRect(x-1.2,y-6,2.4,12);} }
  }
  // 포탑(아래→위 순서)
  const ts=G.towers.slice().sort((a,b)=>a.y-b.y);
  for(const t of ts){ if(t===G.sel||t.show>0){drawRange(t.x,t.y,statOf(t).rng,TYPES[t.type].color);} }
  for(const t of ts)drawTower(t);
  if(G.sel){ctx.strokeStyle='#ffe08a';ctx.lineWidth=2.5;ctx.strokeRect(G.sel.c*CELL+2,G.sel.r*CELL+2,CELL-4,CELL-4);}
  // 마우스 미리보기
  if(G.hover&&!G.sel&&G.state==='play'){const[c,r]=G.hover; if(c>=0&&r>=0&&c<COLS&&r<ROWS&&!blocked[r][c]&&!G.towers.some(t=>t.c===c&&t.r===r)){
    const x=c*CELL+20,y=r*CELL+20,ok=G.gold>=TYPES[G.build].cost; drawRange(x,y,TYPES[G.build].lv[0].rng,ok?'rgba(255,255,255,.8)':'#ff6b6b');
    drawTower({type:G.build,x,y,lv:0,ang:-Math.PI/2,rec:0,born:1},.6);} }
  const es=G.enemies.slice().sort((a,b)=>a.y-b.y); for(const e of es)drawEnemy(e);
  for(const p of G.projs)drawProj(p);
  for(const q of G.rings){const a=q.life/q.max;ctx.globalAlpha=a;ctx.strokeStyle=q.col;ctx.lineWidth=q.w;circle(q.x,q.y,q.r);if(q.fill){ctx.fillStyle=q.col;ctx.globalAlpha=a*.35;ctx.fill();ctx.globalAlpha=a;}ctx.stroke();}
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;circle(q.x,q.y,q.r);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.font='800 14px sans-serif';ctx.textAlign='center';
  for(const q of G.floats){ctx.globalAlpha=Math.min(1,q.life/q.max*1.6);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(q.text,q.x,q.y);ctx.fillStyle=q.col;ctx.fillText(q.text,q.x,q.y);}
  ctx.globalAlpha=1;
  // 파도 진행 막대
  if(G.active){const tot=WAVES[G.wave-1].reduce((s,g)=>s+g[1],0),left=G.queue.length+G.enemies.length;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,4);ctx.fillStyle='#6be3a0';ctx.fillRect(0,0,W*(1-left/tot),4);}
  ctx.restore();
}

/* ---------- 루프 ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  let rem=dt*G.speed; while(rem>0){const s=Math.min(rem,1/30);update(s);rem-=s;}
  render(); requestAnimationFrame(frame);
}
newGame(); resize(); requestAnimationFrame(frame);

window.__td={CFG,get G(){return G;},update,newGame,placeTower,upgradeTower,sellTower,startWave,blocked,TYPES,ENEMY,WAVES,CELL,COLS,ROWS,nearPath,syncUI,render};
})();
</script>
</body>
</html>
